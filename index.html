<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E4C8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>消費税法 理論道場</title>
<!-- app version 2026-11-11b -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-column app, sticky top bar, bottom tab bar. Answer sheet ruled like 答案用紙. */
:root{
  --paper:#F7F6F1; --sheet:#FFFFFF; --ink:#1F2A33; --sub:#66717C; --rule:#E2E6EA; --line:#CBD3DB;
  --accent:#2E4C8C; --accent-soft:#E7EDF8; --stamp:#C4433A;
  --c1:rgba(127,119,221,.26); --c2:rgba(29,158,117,.24); --c3:rgba(239,159,39,.30); --c4:rgba(212,83,126,.22); --c5:rgba(55,138,221,.24);
  --blank:#EEF1F4; --ok:#1E7D5C; --ng:#B2453F; --gold:#C99A2E;
  --font-ui:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --font-sheet:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151A20; --sheet:#1C232B; --ink:#E7ECF1; --sub:#9AA6B2; --rule:#2B343E; --line:#37424E;
    --accent:#9DB4E8; --accent-soft:#25324A; --stamp:#E26B62;
    --c1:rgba(150,142,240,.32); --c2:rgba(60,190,145,.28); --c3:rgba(239,159,39,.32); --c4:rgba(230,110,150,.28); --c5:rgba(90,165,240,.30);
    --blank:#27313B; --ok:#5CC79E; --ng:#E8857E; --gold:#E0B454;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151A20; --sheet:#1C232B; --ink:#E7ECF1; --sub:#9AA6B2; --rule:#2B343E; --line:#37424E;
  --accent:#9DB4E8; --accent-soft:#25324A; --stamp:#E26B62;
  --c1:rgba(150,142,240,.32); --c2:rgba(60,190,145,.28); --c3:rgba(239,159,39,.32); --c4:rgba(230,110,150,.28); --c5:rgba(90,165,240,.30);
  --blank:#27313B; --ok:#5CC79E; --ng:#E8857E; --gold:#E0B454;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-block:14px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.12em;color:var(--sub);text-transform:uppercase}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-family:var(--font-sheet);font-weight:700;font-size:22px;letter-spacing:.08em}
.streak{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--sheet)}
.streak .flame{color:var(--gold)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:var(--sheet);border-top:1px solid var(--rule);padding:6px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));z-index:20}
.tab{flex:1;max-width:160px;text-align:center;padding:6px 4px;border-radius:10px;font-size:12.5px;color:var(--sub);font-weight:500}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);font-weight:700}

/* cards */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:14px 16px}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--font-sheet);font-size:34px;font-weight:700;line-height:1.1}
.muted{color:var(--sub);font-size:13px}
.pill{font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
.pill.A{border-color:var(--stamp);color:var(--stamp);font-weight:700}
.pill.B{border-color:var(--accent);color:var(--accent)}
.pill.Y{border-color:var(--stamp);background:var(--stamp);color:#fff}
.pill.S{border-color:var(--gold);color:var(--gold);font-weight:700}
.bar{height:8px;background:var(--blank);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#101418}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#101418}}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}

/* menu list */
.menu li{list-style:none}
.menu{padding:0;margin:0;display:grid;gap:6px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.item .no{font-family:var(--font-sheet);font-size:12.5px;color:var(--sub);min-width:3.6em;font-variant-numeric:tabular-nums}
.item .ti{flex:1;min-width:0;font-weight:500;font-size:14px}
.item .ti small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0}
.dot.l1{background:var(--c3);border-color:var(--gold)}
.dot.l2{background:var(--accent);border-color:var(--accent)}
.dot.l3{background:var(--ok);border-color:var(--ok)}
.dot.ng{background:var(--ng);border-color:var(--ng)}
.tag{font-size:11px;color:var(--sub)}
.tag.due{color:var(--stamp);font-weight:700}

/* study */
.back{color:var(--accent);font-size:14px;padding:4px 0;margin-bottom:6px}
.dhead .grp{font-size:12.5px;color:var(--sub)}
.dhead h2{font-family:var(--font-sheet);font-weight:700;font-size:19px;margin-top:2px;letter-spacing:.02em}
.levels{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 6px}
.lv{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:5px 11px;font-size:12.5px}
.lv[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.hint{font-size:12.5px;color:var(--sub);margin:0 0 10px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.legend span{font-size:11.5px;padding:1px 8px;border-radius:4px}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:6px 16px 10px;font-family:var(--font-sheet);font-size:16px;line-height:2.2;font-weight:500;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.2em - 1px),var(--rule) calc(2.2em - 1px),var(--rule) 2.2em);background-position:0 6px;overflow-wrap:anywhere}
.k{padding:1px 2px;border-radius:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c5)}
.k.hid{color:transparent;background:var(--blank);box-shadow:inset 0 -2px 0 var(--line)}
.sheet.blind{color:transparent}.sheet.blind .k{background:transparent}
.reveal{margin-top:10px}
.tts{position:fixed;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom,0px));z-index:19;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-left,0px));background:var(--sheet);border-top:1px solid var(--rule);box-shadow:0 -4px 12px rgba(0,0,0,.06)}
.tts .ttsin{max-width:640px;margin:0 auto;width:100%;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wrap.study{padding-bottom:150px}
@media (max-width:380px){body{font-size:14px}.sheet{font-size:15px;padding:6px 10px 8px}.dhead h2{font-size:17px}.lv{padding:4px 8px;font-size:12px}.tts .btn{padding:6px 9px;font-size:12.5px}.tts select{font-size:12px;padding:4px 6px}}
.tts .btn{padding:7px 12px;font-size:13px}
.tts select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:5px 6px;width:auto}
.tts .st{font-size:11.5px;color:var(--sub);width:100%}
.sheet.pick [data-ri]{cursor:pointer}
.sheet.pick [data-ri]:hover{outline:2px dashed var(--accent);outline-offset:1px}
.sheet.pick .plain{background:var(--blank);border-radius:3px}
.k.now,.plain.now{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
.sheet.blind .now{color:var(--ink);background:var(--blank)}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.g{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:10px 4px;font-size:13px;font-weight:700;text-align:center;line-height:1.3}
.g small{display:block;font-weight:400;font-size:11px;color:var(--sub)}
.g.x{color:var(--ng)}.g.o{color:var(--ok)}.g.oo{color:var(--accent)}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.nav button{color:var(--accent);font-size:14px;padding:6px 0}
.nav button:disabled{color:var(--line)}
.srs{font-size:12px;color:var(--sub);margin-top:8px}

/* stamp */
.stamp{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-12deg) scale(.6);font-family:var(--font-sheet);font-weight:700;font-size:44px;color:var(--stamp);border:4px solid var(--stamp);border-radius:10px;padding:6px 18px;opacity:0;pointer-events:none;z-index:30;letter-spacing:.1em;background:color-mix(in srgb,var(--sheet) 70%,transparent)}
.stamp.on{animation:stamp .9s ease-out forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(1.6)}25%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) rotate(-12deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.stamp.on{animation:none;opacity:0}.bar i{transition:none}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:25}

/* browse */
.theme-h{font-size:12.5px;color:var(--sub);margin:16px 0 6px;font-weight:700;letter-spacing:.06em}
.thy{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;margin-bottom:6px;overflow:hidden}
.thy>button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px}
.thy .ti{flex:1;min-width:0;font-weight:500;font-size:14px}
.thy .prog{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.thy .sub{border-top:1px solid var(--rule);padding:4px 8px 8px}
.thy .sub .item{border:none;border-radius:8px;padding:8px 6px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#101418}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#101418}}

/* settings */
label.f{display:grid;gap:4px;font-size:13px;color:var(--sub)}
input[type=number],input[type=password],select,textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:70px;font-size:12px}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:flex;flex-direction:column;align-items:center;gap:2px;width:64px;font-size:11px;color:var(--sub);text-align:center}
.badge .m{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--font-sheet);font-weight:700;color:var(--sub);background:var(--sheet)}
.badge.got .m{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--sheet))}
.foot{margin-top:28px;font-size:12px;color:var(--sub);line-height:1.7}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" role="tablist" aria-label="画面">
  <button class="tab" role="tab" data-tab="home" aria-selected="true">今日</button>
  <button class="tab" role="tab" data-tab="browse" aria-selected="false">理論一覧</button>
  <button class="tab" role="tab" data-tab="stats" aria-selected="false">記録</button>
  <button class="tab" role="tab" data-tab="settings" aria-selected="false">設定</button>
</nav>
<div class="stamp" id="stamp" aria-hidden="true">合格</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
var DKEY="riron-data-v1",THEORIES=[];
try{var dd=JSON.parse(localStorage.getItem(DKEY)||"null");if(Array.isArray(dd)&&dd.length)THEORIES=dd}catch(e){}
// 学習順（Aランク→習った順のBランク→C）
// 学習順：TAC予告理論 → 推奨理論 → 残りのAランク → 講義順のB → C
var ORDER=["1-1","1-6","3-1","3-5","1-3","1-4","4-2","1-2","2-1","3-15","4-3","3-8","3-9","1-11","3-12","2-2","3-2","3-17","3-6","3-7","3-11","4-1","1-5","1-7","1-8","1-9","1-10","1-12","1-13","1-14","1-16","3-3","3-4","3-10","3-14","3-16","4-4","5-2","5-3","5-5","5-6","5-7","1-15","1-17","3-13","4-5","4-6","5-1","5-4"];
// TACテキスト巻頭「理論暗記予定表」：予告理論（実力テスト・ミニテスト）と推奨理論
var YOKOKU={"1-1":"№1","1-6":"№2","3-1":"№2","1-3":"№3","3-5":"№3","1-4":"№4","4-2":"№4"};
var SUISHO={"1-2":"№1","2-1":"№1","3-15":"№2","3-8":"№3","3-9":"№3","1-11":"№4","3-12":"№4","4-3":"№4"};
function mark(no){return YOKOKU[no]?'<span class="pill Y">予告'+YOKOKU[no]+'</span>':SUISHO[no]?'<span class="pill S">推奨'+SUISHO[no]+'</span>':''}
var TH={},ITEMS=[],BYID={};
function buildIndex(){TH={};ITEMS=[];BYID={};THEORIES.forEach(function(t){TH[t.no]=t});ORDER.forEach(function(no){var t=TH[no];if(!t)return;t.items.forEach(function(it,i){it.id=no+"#"+i;it.th=t;it.idx=i;ITEMS.push(it)})});THEORIES.forEach(function(t){if(ORDER.indexOf(t.no)<0)t.items.forEach(function(it,i){it.id=t.no+"#"+i;it.th=t;it.idx=i;ITEMS.push(it)})});ITEMS.forEach(function(it){BYID[it.id]=it})}
buildIndex();

// ===== 状態 =====
var KEY="riron-dojo-v1";
var S={items:{},xp:0,streak:0,last:"",log:{},daily:2,ranks:["A","B"],lvl:1,rate:1,voice:"",ear:true,upd:0};
var SYNC={token:"",gist:"",last:"",msg:""};
try{var sv2=JSON.parse(localStorage.getItem("riron-sync")||"null");if(sv2)SYNC=Object.assign(SYNC,sv2)}catch(e){}
function saveSync(){try{localStorage.setItem("riron-sync",JSON.stringify(SYNC))}catch(e){}}
try{var saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved&&saved.items)S=Object.assign(S,saved)}catch(e){}
function save(){S.upd=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}schedulePush()}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysFrom(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
var INTERVALS=[1,3,7,14,30,60];
function st(id){return S.items[id]||{lv:0,due:"",reps:0,lapses:0}}
function isDue(id){var s=st(id);return s.reps>0&&s.due&&s.due<=today()}
function grade(id,g){ // g: 0 だめ 1 微妙 2 言えた 3 完璧
  var s=st(id),t=today();
  if(g===0){s.lv=0;s.lapses++;s.due=t}
  else{var step=g===1?0:g===2?1:2;s.lv=Math.min(INTERVALS.length-1,(s.reps===0?0:s.lv)+step);var gap=INTERVALS[s.lv];var d=new Date();d.setDate(d.getDate()+gap);s.due=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  if(s.reps===0)s.first=t;
  s.reps++;s.last=t;S.items[id]=s;
  var gain=[2,5,10,15][g];S.xp+=gain;S.log[t]=(S.log[t]||0)+1;
  if(S.last!==t){var y=new Date();y.setDate(y.getDate()-1);var ys=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");S.streak=(S.last===ys)?S.streak+1:1;S.last=t}
  save();return gain;
}
function rankTitle(xp){var r=[[0,"見習い"],[100,"受験生"],[300,"条文読み"],[700,"理論番長"],[1500,"合格圏"],[3000,"免除の達人"],[6000,"消費税マスター"]];var n=r[0][1];r.forEach(function(x){if(xp>=x[0])n=x[1]});return n}
function mastered(id){return st(id).lv>=3}

// ===== 今日のメニュー =====
function menu(){
  var due=ITEMS.filter(function(it){return isDue(it.id)});
  var fresh=ITEMS.filter(function(it){return st(it.id).reps===0&&S.ranks.indexOf(it.th.rank)>=0});
  var doneToday=S.log[today()]||0;
  var newToday=ITEMS.filter(function(it){return st(it.id).first===today()}).length;
  return {due:due,fresh:fresh.slice(0,Math.max(0,S.daily-newToday)),doneToday:doneToday};
}

// ===== 描画 =====
var app=document.getElementById("app");
var view={tab:"home",id:null,level:S.lvl||1,queue:[],qi:0,open:{},filter:"all"};
function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>")}
function dotClass(id){var s=st(id);if(s.reps===0)return"";if(isDue(id)&&s.lapses>0&&s.lv===0)return"ng";return s.lv>=3?"l3":s.lv>=1?"l2":"l1"}
function itemRow(it,extra){var s=st(it.id);var tag=isDue(it.id)?'<span class="tag due">復習</span>':s.reps===0?'<span class="tag">未</span>':'<span class="tag">'+(s.due?"次 "+s.due.slice(5).replace("-","/"):"")+'</span>';
  return '<li><button class="item" data-open="'+it.id+'"><span class="no">'+esc(it.th.no)+'</span><span class="ti">'+esc(it.title)+'<small>'+esc(it.th.title)+'　<span class="pill '+it.th.rank+'">'+it.th.rank+'</span> '+mark(it.th.no)+' '+esc(it.imp)+'</small></span>'+tag+'<span class="dot '+dotClass(it.id)+'"></span></button></li>'}

function renderHome(){
  var m=menu();var total=ITEMS.length,done=ITEMS.filter(function(i){return st(i.id).reps>0}).length,mast=ITEMS.filter(function(i){return mastered(i.id)}).length;
  var goal=m.due.length+m.fresh.length;var todayDone=m.doneToday;
  var h='<div class="top"><h1>理論道場</h1><span class="streak"><span class="flame">🔥</span><span class="num">'+S.streak+'</span>日</span></div>';
  h+='<div class="stack">';

var TTS={ok:("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window),on:false,id:null,i:-1,voices:[],timer:null,seq:0,pick:false};
function loadVoices(){if(!TTS.ok)return;TTS.voices=speechSynthesis.getVoices().filter(function(v){return /^ja/i.test(v.lang)})}

function pickVoice(){if(S.voice){var v=TTS.voices.filter(function(x){return (x.voiceURI||x.name)===S.voice||x.name===S.voice})[0];if(v)return v}
  // 高品質な声を優先：Edgeの Natural → iOSの拡張/プレミアム → Google → その他
  function q(v){var u=(v.voiceURI||"")+" "+v.name;var s=0;if(/Natural/i.test(u))s+=40;if(/premium/i.test(u))s+=30;if(/enhanced|拡張/i.test(u))s+=20;if(/Google/i.test(u))s+=10;if(/Kyoko|O-ren|Nanami|Hattori|Otoya|Ayumi/i.test(u))s+=5;if(v.localService)s+=1;return s}
  var best=null,bs=-1;TTS.voices.forEach(function(v){var sc=q(v);if(sc>bs){bs=sc;best=v}});return best}

function ttsJump(it,delta){if(!TTS.on||TTS.id!==it.id)return;var target=Math.max(0,Math.min(it.runs.length-1,TTS.i+delta));TTS.seq++;if(TTS.timer){clearTimeout(TTS.timer);TTS.timer=null}speechSynthesis.cancel();TTS.i=target-1;speakNext(it)}
function speakNext(it){if(!TTS.on||TTS.id!==it.id)return;var seq=TTS.seq;TTS.i++;if(TTS.i>=it.runs.length){TTS.on=false;TTS.id=null;TTS.i=-1;render();return}
  var p=it.runs[TTS.i],L=view.level;var hidden=p[1]&&((L===1&&(p[1]==="c5"||p[1]==="c4"))||L===2||L===3);
  // sync highlight without full re-render
  document.querySelectorAll('#sheet .now').forEach(function(e){e.classList.remove('now')});var el=document.querySelector('#sheet [data-ri="'+TTS.i+'"]');if(el){el.classList.add('now');if(el.scrollIntoView)el.scrollIntoView({block:'nearest'})}
  var text=p[0].replace(/\n/g,'。').replace(/[（(]注[０-９0-9]+[）)]/g,'').replace(/（(法|令|規|法附則|令附則)[^）]*）/g,'').replace(/[ \u3000]+/g,'').replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g,function(c){return '、'+'一二三四五六七八九十'['①②③④⑤⑥⑦⑧⑨⑩'.indexOf(c)]+'、'});
  if(hidden&&S.ear){var ms=Math.min(7000,Math.max(1200,p[0].length*160/S.rate));TTS.timer=setTimeout(function(){if(seq===TTS.seq)speakNext(it)},ms);return}
  if(!text.replace(/[。、\s]/g,'')){speakNext(it);return}

  var r=remote,local=S;
  if((r.upd||0)>(local.upd||0)){var keep={daily:local.daily,ranks:local.ranks,lvl:local.lvl,rate:local.rate,voice:local.voice,ear:local.ear};
    S=Object.assign({},local,{items:local.items,xp:Math.max(local.xp||0,r.xp||0),streak:Math.max(local.streak||0,r.streak||0),last:(r.last>local.last?r.last:local.last),log:local.log,upd:r.upd},keep)}
  Object.keys(r.items||{}).forEach(function(id){var a=S.items[id],b=r.items[id];if(!a||(b.last||"")>(a.last||"")||((b.last||"")===(a.last||"")&&(b.reps||0)>(a.reps||0)))S.items[id]=b});
  Object.keys(r.log||{}).forEach(function(d){S.log[d]=Math.max(S.log[d]||0,r.log[d])});
  S.xp=Math.max(S.xp||0,r.xp||0);S.streak=Math.max(S.streak||0,r.streak||0);if((r.last||"")>(S.last||""))S.last=r.last;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}
function findGist(){return gh("GET","/gists?per_page=100").then(function(list){var g=(list||[]).filter(function(x){return x.files&&x.files[GIST_FILE]})[0];return g?g.id:null})}
function pull(){if(!SYNC.token||!navigator.onLine||syncing)return Promise.resolve();syncing=true;
  var p=SYNC.gist?Promise.resolve(SYNC.gist):findGist().then(function(id){SYNC.gist=id||"";saveSync();return id});
  return p.then(function(id){if(!id)return null;return gh("GET","/gists/"+id).then(function(g){var f=g.files[GIST_FILE];if(!f)return null;if(f.truncated)return fetch(f.raw_url).then(function(r){return r.json()});return JSON.parse(f.content)})})
   .then(function(remote){if(remote)mergeProgress(remote);SYNC.last=new Date().toLocaleString("ja-JP");SYNC.msg="同期しました";saveSync();syncing=false;render()})
   .catch(function(e){SYNC.msg="同期できません："+(e.message||e);saveSync();syncing=false;render()});
}
var pushing=false;
function push(){if(!SYNC.token||!navigator.onLine)return Promise.resolve();if(pushing||syncing){schedulePush();return Promise.resolve()}pushing=true;
  var body={files:{}};body.files[GIST_FILE]={content:JSON.stringify(S)};
  var p=SYNC.gist?gh("PATCH","/gists/"+SYNC.gist,body):gh("POST","/gists",Object.assign({description:"理論道場の進捗（自動同期）",public:false},body)).then(function(g){SYNC.gist=g.id;saveSync();return g});
  return p.then(function(){SYNC.last=new Date().toLocaleString("ja-JP");SYNC.msg="同期しました";saveSync();pushing=false}).catch(function(e){if(/404/.test(e.message)){SYNC.gist="";saveSync()}SYNC.msg="保存できません："+(e.message||e);saveSync();pushing=false});
}
function schedulePush(){if(!SYNC.token)return;if(pushTimer)clearTimeout(pushTimer);pushTimer=setTimeout(function(){pushTimer=null;push()},3000)}
window.addEventListener("online",function(){pull().then(push)});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")pull()});
// ===== 演出 =====
function stampShow(txt){var s=document.getElementById("stamp");s.textContent=txt;s.classList.remove("on");void s.offsetWidth;s.classList.add("on")}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;var c=document.getElementById("confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;var cols=["#2E4C8C","#C99A2E","#C4433A","#1E7D5C","#7F77DD"];var ps=[];for(var i=0;i<120;i++)ps.push({x:c.width/2,y:c.height*0.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:4+Math.random()*4,c:cols[i%cols.length],a:Math.random()*6});var t0=performance.now();(function f(t){var dt=(t-t0)/1000;x.clearRect(0,0,c.width,c.height);ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});if(dt<2.2)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(t0)}

// ===== 操作 =====
function startQueue(){var m=menu();view.queue=m.due.concat(m.fresh).map(function(i){return i.id});view.qi=0;if(!view.queue.length)return;view.id=view.queue[0];view.level=S.lvl;render();scrollTo(0,0)}
function nextInQueue(){view.qi++;if(view.qi>=view.queue.length){view.queue=[];view.qi=0;view.id=null;view.tab="home";render();stampShow("本日終了");confetti();scrollTo(0,0);return}view.id=view.queue[view.qi];view.level=S.lvl;render();scrollTo(0,0)}
document.querySelector(".tabs").addEventListener("click",function(e){var b=e.target.closest("[data-tab]");if(!b)return;ttsStop();view.tab=b.dataset.tab;view.id=null;view.queue=[];render();scrollTo(0,0)});
app.addEventListener("click",function(e){
  var b;
  if(e.target.closest("[data-start]")){startQueue();return}
  if(b=e.target.closest("[data-tts]")){var it=BYID[view.id],m=b.dataset.tts;if(m==="play")ttsPlay(it);else if(m==="stop")ttsStop();else if(m==="prev")ttsJump(it,-1);else if(m==="next")ttsJump(it,1);else if(m==="pick"){TTS.pick=!TTS.pick}render();return}
  if(TTS.pick&&(b=e.target.closest("#sheet [data-ri]"))){var it2=BYID[view.id],ri=+b.dataset.ri;TTS.pick=false;ttsPlay(it2,ri);render();return}
  if(b=e.target.closest("[data-open]")){ttsStop();view.id=b.dataset.open;view.level=S.lvl;view.queue=[];render();scrollTo(0,0);return}
  if(e.target.closest("[data-back]")){ttsStop();if(view.queue.length){view.queue=[];view.qi=0}view.id=null;render();return}
  if(b=e.target.closest("[data-level]")){ttsStop();view.level=+b.dataset.level;render();return}
  if(b=e.target.closest("[data-go]")){ttsStop();view.id=ITEMS[+b.dataset.go].id;render();scrollTo(0,0);return}
  if(b=e.target.closest("[data-grade]")){ttsStop();var g=+b.dataset.grade;var gain=grade(view.id,g);if(g>=2)stampShow(g===3?"合格":"良");if(view.queue.length)nextInQueue();else{render();}return}
  if(b=e.target.closest("[data-reveal]")){var sh=document.getElementById("sheet");sh.classList.toggle("blind");b.textContent=sh.classList.contains("blind")?"答えを見る":"もう一度隠す";return}
  if(b=e.target.closest("[data-filter]")){view.filter=b.dataset.filter;render();return}
  if(b=e.target.closest("[data-toggle]")){view.open[b.dataset.toggle]=!view.open[b.dataset.toggle];render();return}
  if(e.target.closest("[data-sync]")){SYNC.msg="同期中…";render();pull().then(push).then(render);return}
  if(e.target.closest("[data-copy]")){var ta=document.getElementById("exp");var done=function(){e.target.textContent="コピーしました"};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,function(){ta.select();done()})}else{ta.select();done()}return}
  if(e.target.closest("[data-import]")){var msg=document.getElementById("impmsg");try{var o=JSON.parse(document.getElementById("imp").value);if(!o||!o.items)throw 0;S=Object.assign(S,o);save();msg.textContent="読み込みました";render()}catch(err){msg.textContent="形式が違います"}return}
  if(e.target.closest("[data-reset1]")){e.target.textContent="本当に消す（もう一度押す）";e.target.dataset.reset1="";e.target.setAttribute("data-reset2","");delete e.target.dataset.reset1;return}
  if(e.target.closest("[data-reset2]")){S={items:{},xp:0,streak:0,last:"",log:{},daily:S.daily,ranks:S.ranks,lvl:S.lvl};save();render();return}
  var k=e.target.closest(".k");if(k&&!k.closest(".blind"))k.classList.toggle("hid");
});
app.addEventListener("change",function(e){
  if(e.target.id==="datafile"){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var msg=document.getElementById("datamsg");try{var d=JSON.parse(rd.result);if(!Array.isArray(d)||!d.length||!d[0].items)throw 0;try{localStorage.setItem(DKEY,JSON.stringify(d))}catch(err){if(msg)msg.textContent="保存できませんでした（容量不足）";return}THEORIES=d;buildIndex();view.tab="home";render()}catch(err){if(msg)msg.textContent="このファイルは理論データではありません"}};rd.readAsText(f,"utf-8");return}
  if(e.target.id==="daily"){S.daily=Math.max(0,Math.min(10,+e.target.value||0));save()}
  if(e.target.id==="ranks"){S.ranks=e.target.value.split("");save()}
  if(e.target.id==="lvl"){S.lvl=+e.target.value;save()}
  if(e.target.id==="rate"){S.rate=+e.target.value;save()}
  if(e.target.id==="ghtoken"){SYNC.token=e.target.value.trim();SYNC.gist="";SYNC.msg="";saveSync();if(SYNC.token){pull().then(push)}else render()}
  if(e.target.id==="ear"){S.ear=e.target.checked;save()}
  if(e.target.id==="voice"){S.voice=e.target.value;save()}
});
app.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("k")){e.preventDefault();e.target.click()}});
render();
if(SYNC.token)pull().then(push);
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
